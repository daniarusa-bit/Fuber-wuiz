<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>DC Fiber Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#06101d;color:#f8fafc}
button{font:inherit}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}
#home .wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.logo{font-size:13px;font-weight:800;color:#67e8f9;letter-spacing:.08em}
h1{font-size:40px;line-height:1.02;margin:12px 0}
.lead{color:#b7c6d8;line-height:1.5;font-size:17px}
.card{background:#101d2e;border:1px solid #263850;border-radius:24px;padding:18px;margin-top:18px}
.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.count-btn{border:1px solid #2b3e58;background:#142238;color:#fff;border-radius:14px;padding:14px 10px;font-weight:800}
.count-btn.active{background:#42d9f5;color:#06101d;border-color:#42d9f5}
.start{width:100%;border:0;background:#42d9f5;color:#06101d;font-weight:900;font-size:18px;padding:17px;border-radius:16px;margin-top:18px}
.top{position:sticky;top:0;background:#06101df2;backdrop-filter:blur(12px);padding:12px 0;z-index:4}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{border:1px solid #2b3e58;background:#101d2e;color:white;border-radius:12px;padding:10px 12px;font-weight:700}
.progress{height:8px;background:#17263a;border-radius:99px;margin-top:10px;overflow:hidden}
#bar{height:100%;background:#42d9f5;width:0}
.qcard{background:#101d2e;border:1px solid #263850;border-radius:24px;padding:18px;margin-top:12px}
.meta{font-size:13px;color:#9fb0c5}
h2{font-size:25px;line-height:1.25;margin:16px 0}
h2 small{display:block;color:#b8c7d9;font-size:17px;margin-top:9px;font-weight:600}
.options{display:grid;gap:10px}
.opt{width:100%;text-align:left;border:1px solid #293b54;background:#0a1524;color:white;border-radius:16px;padding:14px;display:flex;gap:11px;align-items:flex-start}
.opt.sel{border-color:#42d9f5;background:#0b3040}
.opt.correct{border-color:#34d399;background:#0b2d29}
.opt.wrong{border-color:#fb7185;background:#351522}
.opt:disabled{opacity:1}
.letter{display:grid;place-items:center;min-width:31px;height:31px;border-radius:50%;background:#1d2d43;font-weight:900}
.en{display:block;color:#aebed0;margin-top:5px;font-size:14px}
.feedback{margin-top:14px;padding:14px;border-radius:15px;line-height:1.45}
.feedback.good{background:#0b2d29;border:1px solid #34d399}
.feedback.bad{background:#351522;border:1px solid #fb7185}
.feedback b{display:block;margin-bottom:8px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.next{border:0;background:#42d9f5;color:#06101d;border-radius:14px;padding:14px;font-weight:900}
.back{border:1px solid #2b3e58;background:#142238;color:white;border-radius:14px;padding:14px;font-weight:800}
.result{text-align:center;padding-top:60px}
.score{font-size:68px;font-weight:900;color:#42d9f5}
.muted{color:#9fb0c5}
.review{text-align:left;margin-top:20px}
.item{padding:12px;border-bottom:1px solid #263850}
.ok{color:#34d399}
.bad{color:#fb7185}
.small{font-size:13px;color:#9fb0c5;margin-top:8px}
@media(max-width:420px){.count-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="wrap">
    <div class="logo">DATA CENTER FIBER OPTICS</div>
    <h1>Fiber Quiz<br>RU + EN</h1>
    <p class="lead">База: <b>200 вопросов</b>. Выбери, сколько вопросов хочешь пройти за один тест.</p>

    <div class="card">
      <b>Количество вопросов / Number of questions</b>
      <div class="count-grid">
        <button class="count-btn" data-count="10">10</button>
        <button class="count-btn" data-count="20">20</button>
        <button class="count-btn active" data-count="30">30</button>
        <button class="count-btn" data-count="50">50</button>
        <button class="count-btn" data-count="100">100</button>
        <button class="count-btn" data-count="200">Все 200</button>
      </div>
      <div class="small">Каждый новый тест выбирает случайные вопросы из всей базы.</div>
    </div>

    <button class="start" id="start">Начать тест / Start Test</button>
  </div>
</section>

<section id="quiz" class="screen">
  <div class="wrap">
    <div class="top">
      <div class="topline">
        <button class="ghost" id="exit">← Главная</button>
        <b id="counter">1 / 30</b>
      </div>
      <div class="progress"><div id="bar"></div></div>
    </div>
    <div id="question"></div>
  </div>
</section>

<section id="result" class="screen">
  <div class="wrap result">
    <div class="logo">RESULT / РЕЗУЛЬТАТ</div>
    <div class="score" id="score">0%</div>
    <h2 id="scoreText"></h2>
    <p class="muted">Тест завершён · Test completed</p>
    <button class="start" id="again">Пройти ещё раз / Try Again</button>
    <button class="ghost" style="width:100%;margin-top:10px" id="homeBtn">На главную / Home</button>
    <div class="card review" id="review"></div>
  </div>
</section>

<script>
const ALL_Q=[{"section":"Safety","difficulty":"Easy","correct":0,"q_en":"What is the main safety rule when working with fiber optics?","options_en":["Never look directly into a fiber or connector end-face","Check the light with the unprotected eye","Remove the dust cap early and leave the port open","Clean the connector only after connecting"],"ex_en":"Laser light, including invisible infrared light, can damage the eyes.","q_ru":"Какое главное правило безопасности при работе с оптоволокном?","options_ru":["Никогда не смотреть прямо в fiber или connector end-face","Проверять свет незащищённым глазом","Снимать dust cap заранее и оставлять порт открытым","Чистить коннектор только после подключения"],"ex_ru":"Laser light, включая invisible infrared, может повредить глаза."},{"section":"Safety","difficulty":"Easy","correct":2,"q_en":"Where should cleaved or broken fiber scraps be discarded?","options_en":["In regular trash","In a work-jacket pocket","In a designated sharps container","Leave them on the floor until the end of the shift"],"ex_en":"Fiber shards are extremely fine and can penetrate skin or eyes.","q_ru":"Куда нужно выбрасывать cleaved/broken fiber scraps?","options_ru":["В обычный мусор","В карман рабочей куртки","В designated sharps container","Оставить на полу до конца смены"],"ex_ru":"Fiber shards очень тонкие и могут попасть в кожу или глаза."},{"section":"Safety","difficulty":"Medium","correct":1,"q_en":"What should be done with unused fiber connectors and transceiver ports?","options_en":["Leave them open for ventilation","Cover them with dust caps","Wipe them with a finger before connection","Continuously shine a VFL into them"],"ex_en":"Dust caps help prevent contamination from dust, oil, and debris.","q_ru":"Что нужно делать с unused fiber connectors и transceiver ports?","options_ru":["Оставлять открытыми для вентиляции","Закрывать dust caps","Протирать пальцем перед подключением","Светить VFL внутрь постоянно"],"ex_ru":"Dust caps предотвращают contamination from dust, oil, debris."},{"section":"Fiber Types","difficulty":"Easy","correct":0,"q_en":"What is the core diameter of Single-Mode Fiber (SMF)?","options_en":["8–9 µm","50 µm","62.5 µm","125 µm"],"ex_en":"SMF has a very small 8–9 µm core diameter.","q_ru":"Какой core diameter у Single-Mode Fiber (SMF)?","options_ru":["8–9 µm","50 µm","62.5 µm","125 µm"],"ex_ru":"SMF имеет very small core diameter 8–9 µm."},{"section":"Fiber Types","difficulty":"Easy","correct":2,"q_en":"What is the standard jacket color for single-mode fiber?","options_en":["Orange","Aqua","Yellow","Lime Green"],"ex_en":"Yellow is the standard identifier for single-mode fiber.","q_ru":"Стандартный jacket color для single-mode fiber?","options_ru":["Orange","Aqua","Yellow","Lime Green"],"ex_ru":"Yellow — стандартный identifier для single-mode fiber."},{"section":"Fiber Types","difficulty":"Medium","correct":1,"q_en":"Which single-mode type is preferred for new long-distance or outdoor installations?","options_en":["OS1","OS2","OM3","OM5"],"ex_en":"OS2 has lower attenuation and is used for long-range and outdoor applications.","q_ru":"Какой single-mode тип предпочтителен для новых long-distance/outdoor installations?","options_ru":["OS1","OS2","OM3","OM5"],"ex_ru":"OS2 имеет lower attenuation и используется для long-range/outdoor."},{"section":"Fiber Types","difficulty":"Medium","correct":1,"q_en":"Why is SMF suitable for long-distance links?","options_en":["It has more modal dispersion","It supports only one mode of light propagation","It uses inexpensive LED sources","It has a very large core"],"ex_en":"Single-mode transmission eliminates modal dispersion and reduces attenuation.","q_ru":"Какая главная причина, почему SMF подходит для long-distance links?","options_ru":["Больше modal dispersion","Только один mode of light propagation","Дешёвые LED источники","Очень большая сердцевина"],"ex_ru":"Single mode eliminates modal dispersion and lowers attenuation."},{"section":"Fiber Types","difficulty":"Easy","correct":2,"q_en":"What is the core diameter of OM1 multimode fiber?","options_en":["8–9 µm","50 µm","62.5 µm","100 µm"],"ex_en":"OM1 uses a 62.5 µm core.","q_ru":"Какой core diameter у OM1 multimode fiber?","options_ru":["8–9 µm","50 µm","62.5 µm","100 µm"],"ex_ru":"OM1 использует 62.5 µm core."},{"section":"Fiber Types","difficulty":"Easy","correct":2,"q_en":"What is the core diameter of OM2 through OM5 multimode fiber?","options_en":["8 µm","9 µm","50 µm","62.5 µm"],"ex_en":"OM2, OM3, OM4, and OM5 use a 50 µm core.","q_ru":"Какой core diameter у OM2–OM5 multimode fiber?","options_ru":["8 µm","9 µm","50 µm","62.5 µm"],"ex_ru":"OM2, OM3, OM4, OM5 используют 50 µm core."},{"section":"Fiber Types","difficulty":"Medium","correct":0,"q_en":"What jacket color is commonly used for OM3/OM4 in the manual?","options_en":["Aqua","Yellow","Brown","Black"],"ex_en":"OM3 and OM4 are identified as Aqua.","q_ru":"Какой цвет jacket у OM3/OM4 обычно указан в manual?","options_ru":["Aqua","Yellow","Brown","Black"],"ex_ru":"OM3 and OM4 обозначены Aqua."},{"section":"Fiber Types","difficulty":"Medium","correct":2,"q_en":"What is the jacket color of OM5?","options_en":["Orange","Aqua","Lime Green","Yellow"],"ex_en":"OM5 is identified as Lime Green.","q_ru":"Какой цвет jacket у OM5?","options_ru":["Orange","Aqua","Lime Green","Yellow"],"ex_ru":"OM5 — Lime Green."},{"section":"Fiber Types","difficulty":"Hard","correct":1,"q_en":"What is modal dispersion?","options_en":["Signal loss caused by a dirty end-face","Different light modes travel at different speeds in MMF","A pin-mapping error in RJ45","Light reflection from an APC connector"],"ex_en":"In MMF, multiple modes travel along different paths, limiting bandwidth and distance.","q_ru":"Что такое modal dispersion?","options_ru":["Потеря сигнала из-за грязного end-face","Разные light modes идут с разной скоростью в MMF","Ошибка pin mapping в RJ45","Отражение света от APC connector"],"ex_ru":"В MMF несколько modes проходят разный путь, ограничивая bandwidth/distance."},{"section":"Connectors","difficulty":"Easy","correct":0,"q_en":"Which fiber connector is most widely used in modern data centers?","options_en":["LC","RJ11","USB-B","BNC"],"ex_en":"The LC small-form-factor connector is widely used on patch panels and equipment.","q_ru":"Какой connector наиболее часто используется в современных data centers для fiber?","options_ru":["LC","RJ11","USB-B","BNC"],"ex_ru":"LC small form factor широко используется на patch panels и equipment."},{"section":"Connectors","difficulty":"Medium","correct":0,"q_en":"What is the ferrule diameter of an LC connector?","options_en":["1.25 mm","2.5 mm","8 mm","12 mm"],"ex_en":"LC uses a 1.25 mm ferrule.","q_ru":"Какой ferrule diameter у LC connector?","options_ru":["1.25 mm","2.5 mm","8 mm","12 mm"],"ex_ru":"LC uses 1.25 mm ferrule."},{"section":"Connectors","difficulty":"Medium","correct":0,"q_en":"What is the standard LC connector configuration?","options_en":["Duplex Tx/Rx side-by-side","12-fiber row","8 copper pins","Single power conductor"],"ex_en":"Duplex LC pairs the transmit and receive fibers side-by-side.","q_ru":"Стандартная LC configuration обычно какая?","options_ru":["Duplex Tx/Rx side-by-side","12-fiber row","8 copper pins","Single power conductor"],"ex_ru":"Duplex LC pairs transmit and receive fibers."},{"section":"Connectors","difficulty":"Easy","correct":0,"q_en":"What does MPO stand for?","options_en":["Multi-fiber Push-On","Metal Power Output","Main Patch Optical","Micro Port Only"],"ex_en":"MPO is a high-density multi-fiber optical connector.","q_ru":"Что означает MPO?","options_ru":["Multi-fiber Push-On","Metal Power Output","Main Patch Optical","Micro Port Only"],"ex_ru":"MPO is a high-density multi-fiber optical connector."},{"section":"Connectors","difficulty":"Medium","correct":0,"q_en":"Which component in an MPO connector aligns the fibers?","options_en":["MT ferrule","RJ45 latch","Cable jacket","Dust cap"],"ex_en":"The MT ferrule aligns multiple fibers in an exact linear arrangement.","q_ru":"Какой component в MPO выравнивает fibers?","options_ru":["MT ferrule","RJ45 latch","Cable jacket","Dust cap"],"ex_ru":"MT ferrule aligns multiple fibers in exact linear arrangement."},{"section":"Connectors","difficulty":"Medium","correct":0,"q_en":"A male MPO connector has...","options_en":["Two guide pins","No alignment features","8 copper pins","Blue boot only"],"ex_en":"Male MPO/MTP connectors have two metal guide pins; female connectors have alignment holes.","q_ru":"Male MPO connector имеет...","options_ru":["Two guide pins","No alignment features","8 copper pins","Blue boot only"],"ex_ru":"Male MPO/MTP has two metal guide pins; female has holes."},{"section":"Connectors","difficulty":"Medium","correct":0,"q_en":"What is MTP?","options_en":["A trademarked enhanced version of MPO by US Conec","A copper Ethernet plug","Only a cleaning tool","A wireless module"],"ex_en":"MTP is backward compatible with standard MPO connectors.","q_ru":"MTP это...","options_ru":["Trademarked enhanced version of MPO by US Conec","Copper Ethernet plug","Only a cleaning tool","A wireless module"],"ex_ru":"MTP is backward compatible with standard MPO connectors."},{"section":"Connectors","difficulty":"Hard","correct":2,"q_en":"Can a UPC connector be mated with an APC connector?","options_en":["Yes, always","Yes, if both are yellow","No; it can damage ferrules and cause high insertion loss","Yes, but only on MMF"],"ex_en":"UPC has a flat end-face and APC has an angled end-face, so they should not be mated.","q_ru":"Можно ли mate UPC connector с APC connector?","options_ru":["Да, всегда","Да, если оба yellow","Нет, можно повредить ferrules и получить high insertion loss","Да, только на MMF"],"ex_ru":"UPC flat end-face and APC angled end-face should not be mated."},{"section":"Connectors","difficulty":"Medium","correct":0,"q_en":"What color boot or housing is normally used for an APC connector?","options_en":["Green","Blue","Orange","Lime"],"ex_en":"APC polish is identified by a green connector boot or housing.","q_ru":"APC connector обычно имеет какой color boot/housing?","options_ru":["Green","Blue","Orange","Lime"],"ex_ru":"APC polish is identified by green connector boot/housing."},{"section":"Copper/RJ45","difficulty":"Easy","correct":0,"q_en":"RJ45 is technically designated as...","options_en":["8P8C","4P4C","LC duplex","MPO-12"],"ex_en":"8P8C means 8-Position, 8-Contact modular plug.","q_ru":"RJ45 технически обозначается как...","options_ru":["8P8C","4P4C","LC duplex","MPO-12"],"ex_ru":"8-Position, 8-Contact modular plug."},{"section":"Copper/RJ45","difficulty":"Medium","correct":0,"q_en":"Which pairs carry data in 10/100 Mbps Ethernet?","options_en":["Pairs 2 and 3","Pairs 1 and 4","Only Pair 1","All pairs only for PoE"],"ex_en":"Pins 1, 2 and 3, 6 are used in 10/100 Mbps Ethernet.","q_ru":"В 10/100 Mbps Ethernet для data используются какие пары?","options_ru":["Pairs 2 and 3","Pairs 1 and 4","Only pair 1","All pairs for PoE only"],"ex_ru":"Pins 1,2 and 3,6 are used in 10/100 Mbps."},{"section":"Copper/RJ45","difficulty":"Medium","correct":0,"q_en":"In Gigabit Ethernet 1000BASE-T, which pairs are used?","options_en":["All 4 pairs","Only the orange pair","Only the green pair","No twisted pairs"],"ex_en":"Gigabit Ethernet uses all four pairs for simultaneous bidirectional transmission.","q_ru":"В Gigabit Ethernet 1000BASE-T используются...","options_ru":["All 4 pairs","Only orange pair","Only green pair","No twisted pairs"],"ex_ru":"Gigabit Ethernet uses all four pairs for bidirectional transmission."},{"section":"Copper/RJ45","difficulty":"Easy","correct":0,"q_en":"Which wiring standard is most common in commercial and data-center installations?","options_en":["T568B","T568A","USOC only","Rollover only"],"ex_en":"T568B is the most widely used standard in commercial, enterprise, and data-center installations.","q_ru":"Какой wiring standard наиболее распространён в commercial/data center installations?","options_ru":["T568B","T568A","USOC only","Rollover only"],"ex_ru":"T568B is widely used in commercial, enterprise and data centers."},{"section":"Copper/RJ45","difficulty":"Hard","correct":0,"q_en":"The T568B pin order begins with...","options_en":["White/Orange, Orange","White/Green, Green","Blue, White/Blue","Brown, White/Brown"],"ex_en":"T568B begins White/Orange, Orange, White/Green, Blue, White/Blue, Green, White/Brown, Brown.","q_ru":"Pin order T568B начинается с...","options_ru":["White/Orange, Orange","White/Green, Green","Blue, White/Blue","Brown, White/Brown"],"ex_ru":"T568B order: W/O, O, W/G, B, W/B, G, W/Br, Br."},{"section":"Copper/RJ45","difficulty":"Medium","correct":0,"q_en":"What happens if one cable end is T568A and the other is T568B?","options_en":["It becomes a crossover cable","It becomes a fiber trunk","It becomes PoE++ only","Nothing; it is always straight-through"],"ex_en":"Mixing T568A and T568B creates a crossover cable.","q_ru":"Что произойдёт, если один конец cable T568A, другой T568B?","options_ru":["Получится crossover cable","Получится fiber trunk","Кабель станет PoE++ only","Ничего, это always straight-through"],"ex_ru":"Mixing A and B creates crossover cable."},{"section":"Copper/RJ45","difficulty":"Medium","correct":0,"q_en":"Why are crossover cables almost obsolete in modern networks?","options_en":["Because of Auto-MDI/X","Because of APC polish","Because of OM5 color coding","Because of OTDR launch cables"],"ex_en":"Modern network equipment can automatically detect and adjust for cable type using Auto-MDI/X.","q_ru":"Почему crossover cables сейчас почти obsolete?","options_ru":["Из-за Auto-MDI/X","Из-за APC polish","Из-за OM5 color","Из-за OTDR launch cable"],"ex_ru":"Modern equipment detects/adjusts cable type automatically."},{"section":"Twisted Pair","difficulty":"Easy","correct":0,"q_en":"How many twisted pairs are inside a standard Ethernet cable?","options_en":["4","2","6","8"],"ex_en":"Eight let selectedCount=30;
let Q=[];
let i=0;
let answers={};
let locked=false;

const screens=[...document.querySelectorAll('.screen')];

function show(id){
  screens.forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function shuffle(arr){
  const a=[...arr];
  for(let j=a.length-1;j>0;j--){
    const k=Math.floor(Math.random()*(j+1));
    [a[j],a[k]]=[a[k],a[j]];
  }
  return a;
}

function startQuiz(){
  Q=shuffle(ALL_Q).slice(0, selectedCount);
  i=0;
  answers={};
  locked=false;
  show('quiz');
  render();
}

document.querySelectorAll('.count-btn').forEach(btn=>{
  btn.onclick=()=>{
    selectedCount=+btn.dataset.count;
    document.querySelectorAll('.count-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  };
});

function render(){
  const q=Q[i];
  const ans=answers[i];
  locked=ans!==undefined;

  document.getElementById('counter').textContent=(i+1)+' / '+Q.length;
  document.getElementById('bar').style.width=((i+1)/Q.length*100)+'%';

  let opts=q.options_ru.map((ru,k)=>`
    <button class="opt ${locked ? (k===q.correct?'correct':(ans===k?'wrong':'')) : ''}" data-k="${k}" ${locked?'disabled':''}>
      <span class="letter">${'ABCD'[k]}</span>
      <span><b>${ru}</b><span class="en">EN: ${q.options_en[k]}</span></span>
    </button>`).join('');

  let feedback='';
  if(locked){
    const ok=ans===q.correct;
    feedback=`<div class="feedback ${ok?'good':'bad'}">
      <b>${ok?'✅ Правильно / Correct':'❌ Неправильно / Incorrect'}</b>
      <div><strong>Правильный ответ / Correct answer:</strong><br>
      ${q.options_ru[q.correct]}<span class="en">EN: ${q.options_en[q.correct]}</span></div>
      <div style="margin-top:10px">${q.ex_ru}<span class="en">EN: ${q.ex_en}</span></div>
    </div>`;
  }

  document.getElementById('question').innerHTML=`
    <div class="qcard">
      <div class="meta">${q.section} · ${q.difficulty}</div>
      <h2>${q.q_ru}<small>EN: ${q.q_en}</small></h2>
      <div class="options">${opts}</div>
      ${feedback}
      <div class="nav">
        <button class="back" id="prev" ${i===0?'disabled':''}>Назад / Back</button>
        <button class="next" id="next">${i===Q.length-1?'Завершить / Finish':'Дальше / Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked) return;
    answers[i]=+b.dataset.k;
    render();
  });

  document.getElementById('prev').onclick=()=>{
    if(i>0){i--;render();window.scrollTo(0,0);}
  };

  document.getElementById('next').onclick=()=>{
    if(answers[i]===undefined){
      alert('Выбери ответ / Choose an answer');
      return;
    }
    if(i<Q.length-1){
      i++;
      render();
      window.scrollTo(0,0);
    } else {
      finish();
    }
  };
}

function finish(){
  let c=0;
  Q.forEach((q,n)=>{if(answers[n]===q.correct)c++;});
  const pct=Math.round(c/Q.length*100);
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('scoreText').textContent=c+' из '+Q.length+' правильных / '+c+' of '+Q.length+' correct';
  document.getElementById('review').innerHTML='<b>Разбор / Review</b>'+Q.map((q,n)=>`
    <div class="item">
      <span class="${answers[n]===q.correct?'ok':'bad'}">${answers[n]===q.correct?'✓':'✕'} ${n+1}.</span>
      ${q.q_ru}
      <br><span class="muted">Correct: ${q.options_ru[q.correct]} / ${q.options_en[q.correct]}</span>
    </div>`).join('');
  show('result');
}

document.getElementById('start').onclick=startQuiz;
document.getElementById('again').onclick=startQuiz;
document.getElementById('exit').onclick=()=>show('home');
document.getElementById('homeBtn').onclick=()=>show('home');
</script>
</body>
</html>
